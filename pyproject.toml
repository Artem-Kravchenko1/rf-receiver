[project]
name = "fm-receiver"
version = "0.1.0"
description = "FM band receiver circuit calculation"
readme = "README.md"
authors = [
    { name = "Artem Kravchenko", email = "powitrula2015@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "marimo>=0.25.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "sympy>=1.14.0",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
    "python-docx>=1.2.0",
    "ruff>=0.16.10",
]
