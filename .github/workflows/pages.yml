name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0 # no floating major tag, full version required

      - name: Build (tests, figures, data, GIF, report)
        run: uv run fm-build

      - name: Assemble site
        run: |
          mkdir -p site
          cp pages/index.html report.docx site/
          cp -r results/figures results/data results/animations site/
          uv run marimo export html-wasm explore.py -o site/notes --mode run
          rm -f site/notes/*.md  # marimo bundles a notes file, not needed on the site
          mkdir -p site/notes/public
          (cd src && zip -qr ../site/notes/public/fm_receiver.zip fm_receiver -x "*__pycache__*")

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
